body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); }

}

    return i < 0 ? t : t.slice(0, i) + '<mark>' + t.slice(i, i + q.length) + '</mark>' + t.slice(i + q.length);
  }
  const person = (p) => hl(p.name) + (p.aff ? '<span class="aff">' + hl(t(p.aff)) + '</span>' : '');

  function card(s, sl) {
    const [k, label] = kind(s);
    const [main, ...subs] = (s.title.length ? s.title : [s.tag]).map(t);
    let h = '<article class="sess ' + k + '"><div class="sh"><span class="room">' + esc(s.room) + '</span>' +
      '<span class="tag">' + esc(t(label)) + '</span><span class="when">' + esc(t(sl.label)) + '</span></div><div class="sb">';
    h += '<h3>' + hl(main) + subs.map((x) => '<span class="sub">' + hl(x) + '</span>').join('') + '</h3>';
    const roles = Object.entries(s.roles);
    if (roles.length) h += '<dl class="roles">' + roles.map(([r, ps]) => '<div><dt class="' + (RC[r] || 'r-pan') + '">' + esc(t(r)) + '</dt><dd>' + ps.map(person).join(SEP) + '</dd></div>').join('') + '</dl>';
    if (s.papers.length) {
      h += '<ol class="papers">' + s.papers.map((p) => {
        const lead = (p.role === '主講' || p.role === '講者') ? '<span class="lead">' + esc(t('主講')) + '</span>' : '';
        return '<li><p class="pt">' + hl(t(p.title)) + '</p><p class="pa">' + lead + p.authors.map(person).join(SEP) +
          p.revs.map((r) => '<span class="rev">' + (EN ? 'Discussant ' : '評 ') + hl(r) + '</span>').join('') + '</p></li>';
      }).join('') + '</ol>';
    }
    return h + '</div></article>';
  }

  function slotHead(d, sl, showDay) {
    const live = isNow(d, sl) ? '<span class="live">' + (EN ? 'Now' : '進行中') + '</span>' : '';
    const when = EN ? (showDay ? t(d.wd) + ' ' + d.date + ' · ' : '') : (showDay ? d.date + '（' + d.wd + '）' : '') + (PART[sl.part] || sl.part) + ' ';
    return '<h2 class="slot-h"><span class="no">' + esc(t(sl.label)) + '</span><span class="time">' + esc(when) +
      esc(sl.start) + '–' + esc(sl.end) + '</span>' + live + '</h2>';
  }

  function render() {
    const list = $('list'), nav = $('slotnav'), q = norm(query);
    let html = '', navHtml = '', count = 0;
    D.forEach((d, di) => {
      if (!q && di !== day) return;
      d.slots.forEach((sl, si) => {
        const ss = sl.sessions.filter((s) => !q || s._hay.includes(q));
        if (!ss.length) return;
        count += ss.length;
        const id = 's' + di + '-' + si;
        html += '<section class="slot" id="' + id + '">' + slotHead(d, sl, !!q) + '<div class="sessions">' + ss.map((s) => card(s, sl)).join('') + '</div></section>';
        if (!q) navHtml += '<a href="#' + id + '"' + (isNow(d, sl) ? ' class="now"' : '') + '>' + esc(EN ? t(sl.label).replace(' session', '') : sl.label.replace('特殊時段', '特殊')) + ' ' + esc(sl.start) + '</a>';
      });
    });
    if (q) html = '<p class="status">' + (EN ? 'Found ' + count + ' panel' + (count === 1 ? '' : 's') + ' (both days)' : '找到 ' + count + ' 場（兩天都有搜）') + '</p>' +
      (count ? html : '<p class="empty">' + (EN ? 'No matching panels. Try part of a name, a word from a title, or a room code.' : '沒有符合的場次，試試只打姓氏或教室代號。') + '</p>');
    list.innerHTML = html;
    nav.innerHTML = navHtml;
    nav.hidden = !!q;
    $('clear').hidden = !query;
    [0, 1].forEach((i) => $('d' + i).setAttribute('aria-pressed', String(!q && i === day)));
    setBarH();
  }

  function setBarH() { document.documentElement.style.setProperty('--barh', $('bar').offsetHeight + 'px'); }
  addEventListener('resize', setBarH);

  document.querySelectorAll('.days button').forEach((b) => b.addEventListener('click', () => {
    day = Number(b.dataset.day); query = ''; $('q').value = ''; render(); scrollTo({ top: 0 });
  }));
  $('q').addEventListener('input', (e) => { query = e.target.value; render(); });
  $('clear').addEventListener('click', () => { query = ''; $('q').value = ''; render(); $('q').focus(); });
  $('affs').addEventListener('change', (e) => {
    document.body.classList.toggle('show-aff', e.target.checked);
    try { localStorage.setItem('agenda-aff', e.target.checked ? '1' : '0'); } catch (err) {}
  });
  $('slotnav').addEventListener('click', (e) => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    const el = document.querySelector(a.getAttribute('href'));
    if (el) scrollTo({ top: el.getBoundingClientRect().top + scrollY - $('bar').offsetHeight + 1, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  });
  render();
})();
</script>

</body>
</html>
